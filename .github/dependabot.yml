# Source and dependencies are synced from the private repo, so dependency bumps
# happen there. This public copy only updates the actions its own CI uses.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v5+ ignores package.json overrides with our lockfile.
      - dependency-name: pnpm/action-setup
        update-types: [version-update:semver-major]
